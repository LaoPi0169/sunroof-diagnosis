name: sunroof-diagnosis-ci

# 触发: sunroof-diagnosis 相关文件的 push / PR / 手动 / 封存 tag (sunroof-*)
on:
  push:
    branches: [main]
    tags: ['sunroof-*']
    paths: ['sunroof-diagnosis/**', '.github/workflows/sunroof-ci.yml']
  pull_request:
    paths: ['sunroof-diagnosis/**', '.github/workflows/sunroof-ci.yml']
  workflow_dispatch:

concurrency:
  group: sunroof-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sunroof-diagnosis
    steps:
      - uses: actions/checkout@v4

      # 冻结物 (corpus/eval/合同清单) 按"作者 Windows 磁盘字节"绑定 sha256 (CRLF)。
      # Actions 默认 checkout 为 LF, 会破坏全部 raw 字节哈希互锁 —— 这里以 autocrlf=true
      # 重刷工作区, 逐字节复现作者磁盘状态 (与本地 Windows 完全同口径)。
      - name: Re-materialize working tree as CRLF (byte-identical to author's frozen artifacts)
        run: |
          git config core.autocrlf true
          git rm -q --cached -r .
          git reset -q --hard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 与 Dockerfile (python:3.11-slim) 同版本, 保证本地/CI/镜像三处一致
          python-version: "3.11"

      - name: Install dependencies (uvicorn 供 STAGE-4 干净环境冒烟)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 四阶段流水线: Schema 检查 -> 全量测试(80) -> 日志脱敏扫描 -> 干净环境任务冒烟
      # 与 ci/run_local_ci.py 完全同一入口 (本地复跑 = CI 复跑,
      # 证据可对照 sunroof-diagnosis/ci-evidence.md)
      # tee 进 $GITHUB_STEP_SUMMARY: run 页面匿名可见每阶段 PASS/FAIL 明细, 免登录排障。
      - name: Run CI pipeline (schema + tests + redaction + clean-env smoke)
        run: |
          set -o pipefail
          python ci/run_local_ci.py --evidence-file "evidence/ci-github-run-${{ github.run_number }}.log" | tee "$GITHUB_STEP_SUMMARY"

      - name: Show CI result
        if: always()
        run: tail -n 6 "evidence/ci-github-run-${{ github.run_number }}.log"

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunroof-ci-evidence-run-${{ github.run_number }}
          path: sunroof-diagnosis/evidence/ci-github-run-${{ github.run_number }}.log
          if-no-files-found: error
